<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Centrale — Oggi · Riordino</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --secondary: #8e8e93;
    --accent: #007aff;
    --due: #ff3b30;
    --soon: #ff9500;
    --border: #e5e5ea;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); line-height: 1.4; min-height: 100vh; }
  header { background: var(--card); padding: 14px 20px 10px; position: sticky; top: 0; z-index: 30; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .focus-toggle { background: #f2f2f7; border: none; border-radius: 20px; padding: 6px 12px; font-size: 14px; font-weight: 500; color: var(--accent); }
  .focus-toggle.active { background: var(--accent); color: white; }
  .section-title { padding: 16px 20px 8px; font-size: 13px; font-weight: 600; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .row { background: var(--card); padding: 14px 20px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .row:active { background: #f5f5f7; }
  .priority-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .priority-dot.due { background: var(--due); }
  .priority-dot.soon { background: var(--soon); }
  .priority-dot.later { background: #c7c7cc; }
  .row-content { flex: 1; min-width: 0; }
  .client { font-weight: 600; font-size: 16px; }
  .meta { font-size: 14px; color: var(--secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta.due { color: var(--due); font-weight: 500; }
  .chevron { color: #c7c7cc; font-size: 18px; }
  .detail { background: var(--card); min-height: 100vh; padding: 8px 20px 100px; }
  .back { background: none; border: none; color: var(--accent); font-size: 17px; padding: 12px 0; margin-left: -4px; }
  h2 { margin: 4px 0 2px; font-size: 28px; font-weight: 700; }
  .lot { color: var(--secondary); font-size: 17px; margin-bottom: 20px; }
  .field { margin: 20px 0; }
  .label { font-size: 13px; color: var(--secondary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.4px; }
  .value { font-size: 17px; margin-top: 4px; }
  .actions { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); padding: 12px 20px 28px; border-top: 0.5px solid var(--border); }
  button.primary { width: 100%; padding: 16px; font-size: 17px; font-weight: 600; border-radius: 14px; border: none; background: var(--accent); color: white; }
  button.secondary { width: 100%; padding: 14px; margin-top: 8px; font-size: 16px; font-weight: 500; border-radius: 14px; border: none; background: #f2f2f7; color: var(--accent); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 16px 16px 0 0; padding: 16px 20px 32px; box-shadow: 0 -10px 40px rgba(0,0,0,.15); max-height: 85vh; overflow-y: auto; z-index: 40; }
  .sheet-handle { width: 36px; height: 5px; background: #d1d1d6; border-radius: 3px; margin: 0 auto 12px; }
  .sheet h3 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  textarea, input[type="text"], input[type="date"] { width: 100%; margin: 8px 0 12px; padding: 14px; font-size: 17px; border-radius: 12px; border: 1px solid var(--border); background: #fafafa; }
</style>
</head>
<body>
<header>
  <h1>Oggi</h1>
  <button class="focus-toggle" id="focusBtn" onclick="toggleFocus()">Focus</button>
</header>
<div id="listView"></div>
<div id="detailView" style="display:none"></div>
<div id="sheet" class="sheet" style="display:none">
  <div class="sheet-handle"></div>
  <h3>Segna il contatto</h3>
  <p style="margin:0 0 12px; color:#8e8e93; font-size:15px;">Cosa è successo e qual è il prossimo passo.</p>
  <textarea id="outcome" rows="3" placeholder="Esito (cosa ha detto o fatto il cliente)"></textarea>
  <input type="text" id="next" placeholder="Prossima azione">
  <input type="date" id="date">
  <button class="primary" onclick="saveOutcome()">Conferma</button>
  <button class="secondary" onclick="closeSheet()">Annulla</button>
</div>

<script>
const STORAGE_KEY = "centrale_oggi_riordino_v1";

const seed = [
  { id: "p1", client: "Rossi", lot: "Via Roma 12", stage: "In trattativa", next_action: "Chiamare per visita", next_action_date: new Date().toISOString().slice(0,10), last_outcome: "", priority: "due" },
  { id: "p2", client: "Bianchi", lot: "Lotto A", stage: "Primo contatto", next_action: "Inviare scheda", next_action_date: new Date().toISOString().slice(0,10), last_outcome: "", priority: "due" },
  { id: "p3", client: "Bianchi", lot: "Lotto B", stage: "Primo contatto", next_action: "Attendere risposta", next_action_date: null, last_outcome: "", priority: "later" },
  { id: "p4", client: "Verdi", lot: "Corso Italia 8", stage: "Visita fissata", next_action: "Preparare documenti", next_action_date: new Date(Date.now()+86400000).toISOString().slice(0,10), last_outcome: "Interessato", priority: "soon" },
  { id: "p5", client: "Neri", lot: "Via Dante 3", stage: "In trattativa", next_action: "Richiamare per offerta", next_action_date: new Date().toISOString().slice(0,10), last_outcome: "", priority: "due" }
];

let proposals = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || seed;
let currentId = null;
let focusMode = false;

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(proposals)); }
function today() { return new Date().toISOString().slice(0,10); }

function toggleFocus() {
  focusMode = !focusMode;
  document.getElementById("focusBtn").classList.toggle("active", focusMode);
  document.getElementById("focusBtn").textContent = focusMode ? "Focus on" : "Focus";
  showList();
}

function showList() {
  document.getElementById("detailView").style.display = "none";
  document.getElementById("listView").style.display = "block";
  const list = document.getElementById("listView");
  list.innerHTML = "";

  let items = [...proposals];
  if (focusMode) {
    items = items.filter(p => p.next_action_date && p.next_action_date <= today());
  }

  const due = items.filter(p => p.priority === "due" || (p.next_action_date && p.next_action_date <= today()));
  const soon = items.filter(p => p.priority === "soon" && !(p.next_action_date && p.next_action_date <= today()));
  const later = items.filter(p => p.priority === "later" || (!p.next_action_date));

  function renderGroup(title, group) {
    if (!group.length) return;
    const t = document.createElement("div");
    t.className = "section-title";
    t.textContent = title;
    list.appendChild(t);
    group.forEach(p => {
      const div = document.createElement("div");
      div.className = "row";
      const isDue = p.next_action_date && p.next_action_date <= today();
      div.innerHTML = `
        <div class="priority-dot ${isDue ? 'due' : p.priority}"></div>
        <div class="row-content">
          <div class="client">${p.client} — ${p.lot}</div>
          <div class="meta ${isDue ? 'due' : ''}">${p.next_action || "—"} ${p.next_action_date || ""}</div>
        </div>
        <div class="chevron">›</div>
      `;
      div.onclick = () => select(p.id);
      list.appendChild(div);
    });
  }

  if (focusMode) {
    renderGroup("Focus · oggi", items);
  } else {
    renderGroup("Da fare oggi", due);
    renderGroup("A breve", soon);
    renderGroup("Più avanti", later);
  }

  if (!list.children.length) {
    list.innerHTML = `<div style="padding:40px 20px; text-align:center; color:#8e8e93;">Niente in lista. Ottimo.</div>`;
  }
}

function select(id) {
  currentId = id;
  const p = proposals.find(x => x.id === id);
  document.getElementById("listView").style.display = "none";
  const detail = document.getElementById("detailView");
  detail.style.display = "block";
  detail.innerHTML = `
    <div class="detail">
      <button class="back" onclick="showList()">← Oggi</button>
      <h2>${p.client}</h2>
      <div class="lot">${p.lot}</div>
      <div class="field">
        <div class="label">Stato</div>
        <div class="value">${p.stage}</div>
      </div>
      <div class="field">
        <div class="label">Prossima azione</div>
        <div class="value">${p.next_action || "—"}</div>
        <div class="meta">${p.next_action_date || ""}</div>
      </div>
      <div class="field">
        <div class="label">Ultimo esito</div>
        <div class="value">${p.last_outcome || "—"}</div>
      </div>
    </div>
    <div class="actions">
      <button class="primary" onclick="openSheet()">Segna il contatto</button>
    </div>
  `;
}

function openSheet() {
  const p = proposals.find(x => x.id === currentId);
  document.getElementById("outcome").value = "";
  document.getElementById("next").value = p.next_action || "";
  document.getElementById("date").value = p.next_action_date || today();
  document.getElementById("sheet").style.display = "block";
}

function closeSheet() { document.getElementById("sheet").style.display = "none"; }

function saveOutcome() {
  const p = proposals.find(x => x.id === currentId);
  p.last_outcome = document.getElementById("outcome").value.trim();
  p.next_action = document.getElementById("next").value.trim();
  const d = document.getElementById("date").value;
  p.next_action_date = d || null;
  if (d && d <= today()) p.priority = "due";
  else if (d) p.priority = "soon";
  else p.priority = "later";
  save();
  closeSheet();
  showList();
}

showList();
</script>
</body>
</html>
