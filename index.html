<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Centrale — Oggi</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --secondary: #6e6e73;
    --accent: #007aff;
    --due: #ff3b30;
    --border: #e5e5ea;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    margin: 0; background: var(--bg); color: var(--text); 
    line-height: 1.4;
  }
  header { 
    background: var(--card); 
    padding: 16px 20px 12px; 
    font-weight: 600; 
    font-size: 22px; 
    position: sticky; top: 0; z-index: 20;
    border-bottom: 0.5px solid var(--border);
  }
  .row { 
    background: var(--card); 
    padding: 16px 20px; 
    border-bottom: 0.5px solid var(--border); 
    cursor: pointer;
  }
  .row:active { background: #f0f0f2; }
  .client { font-weight: 600; font-size: 17px; }
  .meta { font-size: 15px; color: var(--secondary); margin-top: 4px; }
  .due { color: var(--due); font-weight: 500; }
  .detail { 
    background: var(--card); 
    min-height: 100vh; 
    padding: 12px 20px 40px;
  }
  .back { 
    background: none; border: none; color: var(--accent); 
    font-size: 17px; padding: 8px 0 16px; margin-left: -4px;
  }
  h2 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
  .field { margin: 16px 0; }
  .label { font-size: 13px; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.5px; }
  .value { font-size: 17px; margin-top: 2px; }
  button.action { 
    width: 100%; padding: 16px; margin: 10px 0; 
    font-size: 17px; font-weight: 500; border-radius: 12px; 
    border: none; background: var(--accent); color: white;
  }
  button.secondary { 
    background: #f2f2f7; color: var(--accent); 
  }
  .sheet { 
    position: fixed; left: 0; right: 0; bottom: 0; 
    background: var(--card); 
    border-radius: 16px 16px 0 0; 
    padding: 20px 20px 32px; 
    box-shadow: 0 -8px 30px rgba(0,0,0,.12);
    max-height: 80vh; overflow-y: auto;
  }
  .sheet h3 { margin: 0 0 8px; font-size: 20px; }
  textarea, input { 
    width: 100%; margin: 8px 0 12px; padding: 14px; 
    font-size: 17px; border-radius: 10px; 
    border: 1px solid var(--border); background: #fafafa;
  }
  .hint { font-size: 14px; color: var(--secondary); margin: 12px 0; }
</style>
</head>
<body>
<header>Oggi</header>
<div id="listView"></div>
<div id="detailView" style="display:none"></div>
<div id="sheet" class="sheet" style="display:none">
  <h3>Segna il contatto</h3>
  <p class="hint">Cosa è successo e qual è il prossimo passo.</p>
  <textarea id="outcome" rows="3" placeholder="Esito (cosa ha detto o fatto il cliente)"></textarea>
  <input id="next" placeholder="Prossima azione">
  <input id="date" type="date">
  <button class="action" onclick="saveOutcome()">Conferma</button>
  <button class="action secondary" onclick="closeSheet()">Annulla</button>
</div>

<script>
const STORAGE_KEY = "centrale_prova_ciclo_mobile_v2";

const seed = [
  { id: "p1", client: "Rossi", lot: "Via Roma 12", stage: "In trattativa", next_action: "Chiamare per visita", next_action_date: new Date().toISOString().slice(0,10), last_outcome: "", conversation_link: null },
  { id: "p2", client: "Bianchi", lot: "Lotto A", stage: "Primo contatto", next_action: "Inviare scheda", next_action_date: new Date().toISOString().slice(0,10), last_outcome: "", conversation_link: null },
  { id: "p3", client: "Bianchi", lot: "Lotto B", stage: "Primo contatto", next_action: "Attendere risposta", next_action_date: null, last_outcome: "", conversation_link: null }
];

let proposals = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || seed;
let currentId = null;

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(proposals)); }
function today() { return new Date().toISOString().slice(0,10); }

function showList() {
  document.getElementById("detailView").style.display = "none";
  document.getElementById("listView").style.display = "block";
  const list = document.getElementById("listView");
  list.innerHTML = "";
  const due = proposals.filter(p => p.next_action_date && p.next_action_date <= today());
  const later = proposals.filter(p => !p.next_action_date || p.next_action_date > today());
  [...due, ...later].forEach(p => {
    const div = document.createElement("div");
    div.className = "row";
    const isDue = p.next_action_date && p.next_action_date <= today();
    div.innerHTML = `
      <div class="client">${p.client} — ${p.lot}</div>
      <div class="meta ${isDue ? 'due' : ''}">${p.next_action || "—"} ${p.next_action_date || ""}</div>
    `;
    div.onclick = () => select(p.id);
    list.appendChild(div);
  });
}

function select(id) {
  currentId = id;
  const p = proposals.find(x => x.id === id);
  document.getElementById("listView").style.display = "none";
  const detail = document.getElementById("detailView");
  detail.style.display = "block";
  detail.innerHTML = `
    <div class="detail">
      <button class="back" onclick="showList()">← Oggi</button>
      <h2>${p.client}</h2>
      <div style="color:#6e6e73; margin-bottom:20px;">${p.lot}</div>
      
      <div class="field">
        <div class="label">Stato</div>
        <div class="value">${p.stage}</div>
      </div>
      <div class="field">
        <div class="label">Prossima azione</div>
        <div class="value">${p.next_action || "—"}</div>
        <div class="meta">${p.next_action_date || ""}</div>
      </div>
      <div class="field">
        <div class="label">Ultimo esito</div>
        <div class="value">${p.last_outcome || "—"}</div>
      </div>
      <div class="field">
        <div class="label">Ultima conversazione</div>
        <div class="value">${p.conversation_link || "—"}</div>
      </div>

      <button class="action" onclick="openSheet()">Segna il contatto</button>
      <button class="action secondary" onclick="linkConversation()">Collega una conversazione</button>
      <p class="hint">Dopo ogni conferma ricarica la pagina: tutto deve restare al suo posto.</p>
    </div>
  `;
}

function openSheet() {
  const p = proposals.find(x => x.id === currentId);
  document.getElementById("outcome").value = "";
  document.getElementById("next").value = p.next_action || "";
  document.getElementById("date").value = p.next_action_date || today();
  document.getElementById("sheet").style.display = "block";
}

function closeSheet() { document.getElementById("sheet").style.display = "none"; }

function saveOutcome() {
  const p = proposals.find(x => x.id === currentId);
  p.last_outcome = document.getElementById("outcome").value.trim();
  p.next_action = document.getElementById("next").value.trim();
  p.next_action_date = document.getElementById("date").value || null;
  p.updated_at = new Date().toISOString();
  save();
  closeSheet();
  select(currentId);
}

function linkConversation() {
  const p = proposals.find(x => x.id === currentId);
  const summary = prompt("Breve nota su questa conversazione:", "Messaggio inviato");
  if (summary === null) return;
  p.conversation_link = summary + " · " + new Date().toLocaleString("it-IT", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
  p.updated_at = new Date().toISOString();
  save();
  select(currentId);
}

showList();
</script>
</body>
</html>
